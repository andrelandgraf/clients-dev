status = "supported"
verified = "2026-11-16"
summary = "Markdown skills with YAML frontmatter, loaded on demand when relevant to a task."
invocation = ["automatic"]
docs = "https://docs.sylph.ai/customize/plugins-and-skills"
notes = [
  "/skills opens the skills browser; /plugin manages marketplace skills. Skills are used automatically, not documented as /skill-name commands.",
  "For duplicate names, first-loaded wins: personal, then project, then plugin skills. Plugin repositories are stored in ~/.adal/plugin-cache/.",
  "The official authoring guide requires YAML frontmatter with at least name and description: https://github.com/SylphAI-Inc/skills/blob/main/skills/create-skill/SKILL.md",
]

[[files]]
path = ".adal/skills/<name>/SKILL.md"
scope = "project"
format = "markdown"

[[files]]
path = "~/.adal/skills/<name>/SKILL.md"
scope = "global"
format = "markdown"

[[fields]]
name = "name"
type = "string"
required = true
description = "Skill name in YAML frontmatter; use lowercase words separated by hyphens."

[[fields]]
name = "description"
type = "string"
required = true
description = "Brief description of what the skill does and when to use it."
