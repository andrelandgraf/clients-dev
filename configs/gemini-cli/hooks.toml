status = "supported"
verified = "2026-07-12"
summary = "Synchronous shell commands that run at lifecycle events across the agent loop, configured under the hooks key in settings.json. Hooks communicate via JSON on stdin/stdout and can inject context, rewrite tool arguments, block actions, mock model responses, or filter tools."
events = [
  "SessionStart", "SessionEnd",
  "BeforeAgent", "AfterAgent",
  "BeforeModel", "AfterModel",
  "BeforeToolSelection",
  "BeforeTool", "AfterTool",
  "PreCompress",
  "Notification",
]
docs = "https://github.com/google-gemini/gemini-cli/blob/main/docs/hooks/index.md"
notes = [
  "Exit code 0 parses stdout as JSON (preferred, including intentional denies); exit code 2 blocks the action with stderr as the reason; other codes warn and continue.",
  "Matchers are regexes for tool events (e.g. \"write_.*\") and exact strings for lifecycle events; \"*\" or \"\" matches all.",
  "Settings precedence: project (.gemini/settings.json) over user (~/.gemini/settings.json) over system (/etc/gemini-cli/settings.json) over extensions.",
  "Project hooks are fingerprinted; a changed name or command is treated as a new untrusted hook and re-confirmed.",
  "Hooks receive GEMINI_PROJECT_DIR, GEMINI_SESSION_ID, GEMINI_CWD env vars (plus CLAUDE_PROJECT_DIR as a compatibility alias).",
  "Manage via /hooks panel, /hooks enable/disable; toggle the system with hooksConfig.enabled.",
]

[[files]]
path = ".gemini/settings.json"
scope = "project"
format = "json"
key = "hooks"

[[files]]
path = "~/.gemini/settings.json"
scope = "global"
format = "json"
key = "hooks"

[[files]]
path = "/etc/gemini-cli/settings.json"
scope = "enterprise"
format = "json"
key = "hooks"
note = "System settings (Linux). Windows: C:\\ProgramData\\gemini-cli\\settings.json; macOS: /Library/Application Support/GeminiCli/settings.json."

[[fields]]
name = "matcher"
type = "string"
description = "Regex (tool events) or exact string (lifecycle events) filtering when the hook group fires."

[[fields]]
name = "sequential"
type = "boolean"
description = "Run hooks in this group one after another instead of in parallel."

[[fields]]
name = "hooks[].type"
type = "\"command\""
required = true
description = "Execution engine. Currently only \"command\" is supported."

[[fields]]
name = "hooks[].command"
type = "string"
required = true
description = "Shell command to execute. Receives event JSON on stdin."

[[fields]]
name = "hooks[].name"
type = "string"
description = "Friendly name for logs and the /hooks commands."

[[fields]]
name = "hooks[].timeout"
type = "number"
description = "Execution timeout in milliseconds (default 60000)."

[[fields]]
name = "hooks[].description"
type = "string"
description = "Brief explanation of the hook's purpose."

[[examples]]
title = "Security check before file writes"
language = "json"
code = '''
{
  "hooks": {
    "BeforeTool": [
      {
        "matcher": "write_file|replace",
        "hooks": [
          {
            "name": "security-check",
            "type": "command",
            "command": "$GEMINI_PROJECT_DIR/.gemini/hooks/security.sh",
            "timeout": 5000
          }
        ]
      }
    ]
  }
}
'''
