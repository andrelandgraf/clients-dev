name: Link check

on:
  schedule:
    # Weekly, Monday 09:00 UTC — catches docs pages that moved or died.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check catalog links
        run: bun run scripts/check-links.ts

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Link check failed: stale docs URLs in the catalog";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "link-check",
            });
            if (issues.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["link-check"],
              body: `The weekly link check found dead or failing documentation URLs. See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the list. Update the affected \`configs/**\` entries and their \`verified\` dates.`,
            });
