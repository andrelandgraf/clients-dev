status = "supported"
verified = "2026-06-21"
summary = "SKILL.md skills following the open Agent Skills standard."
invocation = ["/skill-name"]
notes = ["Skill discovery paths from the open skills CLI (vercel-labs/skills).", "Global path falls back to ~/.clawdbot/skills then ~/.moltbot/skills."]

[[files]]
path = "skills/<name>/SKILL.md"
scope = "project"
format = "markdown"

[[files]]
path = "~/.openclaw/skills/<name>/SKILL.md"
scope = "global"
format = "markdown"

[[fields]]
name = "name"
type = "string"
required = true
description = "Skill identifier (required by the Agent Skills standard)."

[[fields]]
name = "description"
type = "string"
required = true
description = "What the skill does and when to use it."

[[capabilities]]
name = "allowed-tools"
status = "supported"

[[capabilities]]
name = "context: fork"
status = "unsupported"

[[capabilities]]
name = "Hooks"
status = "unsupported"
