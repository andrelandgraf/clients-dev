name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate catalog (validates all configs/**.toml with Zod)
        run: bun run generate

      - name: Check catalog.json is in sync with configs/
        # -I ignores the generatedAt timestamp line, which changes on every run.
        run: |
          if ! git diff -I '"generatedAt":' --exit-code src/data/catalog.json; then
            echo "::error::src/data/catalog.json is out of date. Run 'bun run generate' and commit the result."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
