name: Release core package
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify release version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e 'if (process.env.REF_NAME !== "clients-v" + require("./packages/clients/package.json").version) process.exit(1)'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run generate
      - run: bun run build:registry
      - run: bun run test
      - run: bun run lint
      - run: bun run build:package
      - run: git diff --exit-code src/data/catalog.json public/r
      - name: Stage package with provenance
        working-directory: packages/clients
        run: npm stage publish --provenance --access public
