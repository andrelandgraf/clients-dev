status = "supported"
summary = "JSON/JSONC settings with an amp. prefix at user, workspace, and enterprise-managed scope. Workspace settings override user settings (except keymaps)."
docs = "https://ampcode.com/manual#configuration"
notes = [
  "Edit user settings with `amp config edit`, workspace settings with `amp config edit --workspace`; a custom file can be passed via --settings-file.",
  ".jsonc variants (settings.jsonc) are also read at both user and workspace scope.",
  "Workspace settings are found by searching upward from the cwd to the repository root.",
  "Enterprise managed settings override user and workspace settings and add amp.admin.compatibilityDate.",
  "Keymaps are the exception to precedence: amp.keymap entries in user settings override workspace entries.",
]

[[files]]
path = "~/.config/amp/settings.json"
scope = "global"
format = "json"
note = "User settings (same path on macOS and Linux; %USERPROFILE%\\.config\\amp\\settings.json on Windows)."

[[files]]
path = ".amp/settings.json"
scope = "project"
format = "json"
note = "Workspace settings; nearest file searched upward from cwd to the repo root."

[[files]]
path = "/etc/ampcode/managed-settings.json"
scope = "enterprise"
format = "json"
note = "Managed policy settings (macOS: /Library/Application Support/ampcode/managed-settings.json, Windows: %ProgramData%\\ampcode\\managed-settings.json)."

[[fields]]
name = "amp.mcpServers"
type = "object"
description = "MCP servers that expose tools (see MCP surface)."

[[fields]]
name = "amp.mcpPermissions"
type = "array"
description = "Allow or reject MCP servers matching command/args or url patterns; first matching rule applies."

[[fields]]
name = "amp.tools.disable"
type = "string[]"
description = "Disable tools by name; supports glob patterns and builtin:toolname to disable only the builtin variant."

[[fields]]
name = "amp.keymap"
type = "object"
description = "Customize the CLI keymap; chords are space-separated keys. User entries override workspace entries."

[[fields]]
name = "amp.skills.path"
type = "string"
description = "Additional skill directories, colon-separated (semicolon on Windows), ~ supported."

[[fields]]
name = "amp.skills.disableClaudeCodeSkills"
type = "boolean"
description = "Disable loading skills from Claude Code directories. Default false."

[[fields]]
name = "amp.notifications.enabled"
type = "boolean"
description = "Play notification sounds when the agent completes or is blocked. Default true."

[[fields]]
name = "amp.showCosts"
type = "boolean"
description = "Show thread cost information in the CLI. Default true."

[[fields]]
name = "amp.git.commit.ampThread.enabled"
type = "boolean"
description = "Add the Amp-Thread trailer to agent commits. Default true."

[[fields]]
name = "amp.git.commit.coauthor.enabled"
type = "boolean"
description = "Add Amp as co-author in agent commits. Default true."

[[fields]]
name = "amp.defaultVisibility"
type = "object"
description = "Default thread visibility per repository origin."
values = ["private", "workspace", "group"]

[[fields]]
name = "amp.remoteThreadCreation.enabled"
type = "boolean"
description = "Let ampcode.com create new threads in this interactive TUI. Default false."

[[fields]]
name = "amp.updates.mode"
type = "string"
description = "Update checking behavior. Default auto."
values = ["auto", "warn", "disabled"]

[[fields]]
name = "amp.fuzzy.alwaysIncludePaths"
type = "string[]"
description = "Glob patterns always included in fuzzy file search even if gitignored."

[[fields]]
name = "amp.terminal.copyOnSelect"
type = "boolean"
description = "Copy TUI selections to the clipboard automatically. Default true."

[[fields]]
name = "amp.thread.autoArchiveOnQuit"
type = "boolean"
description = "Archive open CLI threads when quitting. Default false."

[[examples]]
title = "User settings"
language = "json"
code = '''
{
  "amp.mcpServers": {
    "playwright": {
      "command": "npx",
      "args": ["-y", "@playwright/mcp@latest", "--headless"]
    }
  },
  "amp.tools.disable": ["browser_*"],
  "amp.notifications.enabled": false
}
'''
