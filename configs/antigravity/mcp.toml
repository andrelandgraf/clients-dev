status = "supported"
verified = "2026-09-07"
summary = "Configure MCP servers in JSON under the mcpServers key."
transports = ["stdio", "http", "sse"]
auth = ["headers"]
docs = "https://antigravity.google/docs/mcp"
notes = ["Global config is shared with Antigravity CLI. Native clients also support workspace config; add-mcp 2.3.1 installs globally.", "Remote entries use serverUrl (no type field)."]

[[files]]
path = "~/.gemini/config/mcp_config.json"
scope = "global"
format = "json"
key = "mcpServers"

[[fields]]
name = "command"
type = "string"
description = "Command to start a local (stdio) server."

[[fields]]
name = "args"
type = "string[]"
description = "Arguments passed to the command."

[[fields]]
name = "env"
type = "record<string, string>"
description = "Environment variables for the server."

[[fields]]
name = "serverUrl"
type = "string"
description = "Endpoint URL for a remote server."

[[fields]]
name = "headers"
type = "record<string, string>"
description = "HTTP headers for a remote server."

[[files]]
path = ".agents/mcp_config.json"
scope = "project"
format = "json"
key = "mcpServers"
